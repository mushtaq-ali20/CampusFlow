# Development environment. Only Docker is required on the host:
# PHP and Node dependencies are installed inside the containers.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: campusflow-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app
      # Keep dependencies in a Docker volume rather than on the host (much faster on macOS and Windows)
      - vendor:/app/vendor
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - campusflow-network
    environment:
      - SERVER_NAME=:80
      - APP_URL=http://localhost:${APP_PORT:-8080}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=campusflow
      - DB_USERNAME=campusflow
      - DB_PASSWORD=secret
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m
    depends_on:
      mysql:
        condition: service_healthy
      assets:
        condition: service_healthy

  # Builds the frontend assets into public/build and rebuilds them when resources change
  assets:
    image: node:22-slim
    container_name: campusflow-assets
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npx vite build --watch"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "test", "-f", "/app/public/build/manifest.json"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5m

  # MySQL 8.4 LTS, with the character set and collation of Laravel's mysql connection
  mysql:
    image: mysql:8.4
    container_name: campusflow-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: campusflow
      MYSQL_USER: campusflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - campusflow-network
    # Over TCP, so that the server only counts as ready once its first-start initialisation is over
    healthcheck:
      test: ["CMD", "mysql", "--host=127.0.0.1", "--user=campusflow", "--password=secret", "--execute=SELECT 1", "campusflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  campusflow-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  vendor:
    driver: local
  node_modules:
    driver: local

name: Trigger auto deployment for campusflow-demo

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/campusflow-demo-AutoDeployTrigger-764ecb65-88e5-4cce-94cf-d813757820c4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: cfdemoacr31512141.azurecr.io
          registryUsername: ${{ secrets.CAMPUSFLOWDEMO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAMPUSFLOWDEMO_REGISTRY_PASSWORD }}
          containerAppName: campusflow-demo
          resourceGroup: campusflow-demo-rg
          imageToBuild: cfdemoacr31512141.azurecr.io/campusflow-demo:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



name: Deploy campusflow-demo

# Builds the production image and deploys it to the campusflow-demo Azure Container App.
# Merging the release pull request (develop → main) is a push to main, which starts this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy one release at a time, in order
concurrency:
  group: deploy-campusflow-demo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to Azure
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAMPUSFLOWDEMO_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: cfdemoacr31512141.azurecr.io
          registryUsername: ${{ secrets.CAMPUSFLOWDEMO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAMPUSFLOWDEMO_REGISTRY_PASSWORD }}
          containerAppName: campusflow-demo
          resourceGroup: campusflow-demo-rg
          imageToBuild: cfdemoacr31512141.azurecr.io/campusflow-demo:${{ github.sha }}

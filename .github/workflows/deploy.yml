name: Deploy campusflow

# Builds the production image and deploys it to the campusflow Azure Container App.
# Merging the release pull request (develop → main) is a push to main, which starts this workflow.
on:
  push:
    branches: [main]
    # Infrastructure-only changes (Bicep, restore guide) must not rebuild and redeploy the app
    paths-ignore:
      - 'infra/**'
  workflow_dispatch:

# Deploy one release at a time, in order
concurrency:
  group: deploy-campusflow
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to Azure
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CAMPUSFLOW_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAMPUSFLOW_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAMPUSFLOW_AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: campusflowacr.azurecr.io
          registryUsername: ${{ secrets.CAMPUSFLOW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAMPUSFLOW_REGISTRY_PASSWORD }}
          containerAppName: campusflow
          resourceGroup: campusflow-rg
          imageToBuild: campusflowacr.azurecr.io/campusflow:${{ github.sha }}

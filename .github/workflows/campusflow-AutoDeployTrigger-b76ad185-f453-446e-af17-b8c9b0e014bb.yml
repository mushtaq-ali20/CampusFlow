name: Trigger auto deployment for campusflow

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/campusflow-AutoDeployTrigger-b76ad185-f453-446e-af17-b8c9b0e014bb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAMPUSFLOW_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAMPUSFLOW_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAMPUSFLOW_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: campusflowacr.azurecr.io
          registryUsername: ${{ secrets.CAMPUSFLOW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAMPUSFLOW_REGISTRY_PASSWORD }}
          containerAppName: campusflow
          resourceGroup: campusflow-rg
          imageToBuild: campusflowacr.azurecr.io/campusflow:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



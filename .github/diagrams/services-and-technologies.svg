<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-label="A request travels from the browser through FrankenPHP and the Laravel middleware into the Filament panel, whose resources, pages and widgets call the domain services. The services use Eloquent, the permission, activity log and media libraries, mPDF, Laravel Mail and WhatsApp links, which end in MySQL, the storage folder, the mail provider and WhatsApp.">
  <style>

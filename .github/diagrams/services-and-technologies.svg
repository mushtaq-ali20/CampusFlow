  <path class="ea" d="M413 76 V120" marker-end="url(#a3a)"/>
  <text class="l" x="423" y="103">HTTPS</text>

            <rect class="node" x="45" y="120" width="736" height="56" rx="8"/>
  <text class="t" x="61" y="144">FrankenPHP (Caddy + PHP 8.5)</text>
  <text class="s" x="61" y="162">Serves the built assets from public/build with gzip, hands every other request to Laravel</text>
  <path class="ea" d="M413 176 V220" marker-end="url(#a3a)"/>
  <text class="l" x="423" y="203">index.php</text>

            <rect class="node" x="45" y="220" width="736" height="56" rx="8"/>
  <text class="t" x="61" y="244">Laravel 13 middleware</text>
  <text class="s" x="61" y="262">Finds the tenant by domain (spatie/laravel-multitenancy) · login · language · forced password change</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" width="1120" height="550" role="img" aria-label="A push to main starts GitHub Actions, which logs in to Azure with OIDC, pushes the image to the container registry and deploys a new revision of the Container App. The app serves browsers over HTTPS and talks to the MySQL server.">
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .node { fill: #ffffff; stroke: #5f726a; stroke-width: 1.2; }
    .node-accent { fill: #d9f2e6; stroke: #047857; stroke-width: 1.6; }
    .ext { fill: #f5f8f6; stroke: #5f726a; stroke-width: 1.2; }
    .grp { fill: #ecf2ef; stroke: #c3cfc9; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .grp-in { fill: #f5f8f6; stroke: #c3cfc9; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .t { fill: #14211d; font-size: 13.5px; font-weight: 600; }
    .tm { fill: #14211d; font-size: 12.5px; font-weight: 600; }
    .s { fill: #55665f; font-size: 11.5px; }
    .g { fill: #55665f; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .l { fill: #55665f; font-size: 11.5px; }
    .la { fill: #047857; font-size: 11.5px; font-weight: 600; }
    .m { fill: #55665f; font-size: 10.5px; font-family: Consolas, "Cascadia Mono", Menlo, monospace; }
    .e { stroke: #5f726a; stroke-width: 1.4; fill: none; }
    .ea { stroke: #047857; stroke-width: 1.8; fill: none; }
    .head { fill: #5f726a; }
    .head-a { fill: #047857; }
  </style>
  <rect class="bg" x="0" y="0" width="1120" height="550" rx="10"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
    <marker id="a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-a"/></marker>
  </defs>

  <rect class="ext" x="40" y="30" width="140" height="50" rx="8"/>
  <text class="t" x="110" y="60" text-anchor="middle">feature/*</text>
  <path class="e" d="M180 55 H270" marker-end="url(#a2)"/>
  <text class="l" x="225" y="46" text-anchor="middle">pull request</text>

  <rect class="ext" x="270" y="30" width="140" height="50" rx="8"/>
  <text class="t" x="340" y="60" text-anchor="middle">develop</text>
  <path class="e" d="M410 55 H500" marker-end="url(#a2)"/>
  <text class="l" x="455" y="46" text-anchor="middle">release PR</text>

  <rect class="ext" x="500" y="30" width="140" height="50" rx="8"/>
  <text class="t" x="570" y="60" text-anchor="middle">main</text>
  <path class="ea" d="M640 55 H730" marker-end="url(#a2a)"/>
  <text class="la" x="685" y="46" text-anchor="middle">push</text>

  <rect class="node-accent" x="730" y="30" width="360" height="50" rx="8"/>
  <text class="t" x="748" y="52">GitHub Actions</text>
  <text class="s" x="748" y="69">.github/workflows/deploy.yml</text>

  <rect class="grp" x="190" y="150" width="910" height="370" rx="12"/>
  <text class="g" x="206" y="174">Azure · campusflow-rg · Central India</text>

  <rect class="grp-in" x="420" y="185" width="260" height="315" rx="10"/>
  <text class="g" x="436" y="207">Container Apps env</text>

  <path class="ea" d="M745 80 V120 H630 V220" marker-end="url(#a2a)"/>
  <text class="la" x="688" y="112" text-anchor="middle">deploys new revision</text>
  <path class="ea" d="M815 80 V220" marker-end="url(#a2a)"/>
  <text class="la" x="825" y="138">pushes image</text>
  <path class="ea" d="M1010 80 V220" marker-end="url(#a2a)"/>
  <text class="la" x="1020" y="138">OIDC login</text>

  <rect class="ext" x="40" y="220" width="120" height="64" rx="8"/>
  <text class="t" x="100" y="257" text-anchor="middle">Browser</text>
  <path class="e" d="M160 252 H440" marker-end="url(#a2)"/>
  <text class="l" x="300" y="243" text-anchor="middle">HTTPS ingress</text>

  <rect class="node" x="440" y="220" width="220" height="64" rx="8"/>
  <text class="t" x="456" y="247">Container App campusflow</text>
  <text class="s" x="456" y="266">Port 8080 · 0 to 1 replica</text>

  <rect class="node" x="440" y="330" width="220" height="64" rx="8"/>
  <text class="t" x="456" y="357">Job campusflow-seed</text>
  <text class="s" x="456" y="376">Manual · loads the demo data</text>

  <rect class="node" x="730" y="220" width="170" height="64" rx="8"/>
  <text class="t" x="746" y="247">Container Registry</text>
  <text class="s" x="746" y="266">campusflowacr</text>
  <path class="e" d="M730 252 H660" marker-end="url(#a2)"/>
  <text class="l" x="707" y="243" text-anchor="middle">pulls</text>
  <path class="e" d="M815 284 V362 H660" marker-end="url(#a2)"/>
  <text class="l" x="745" y="353" text-anchor="middle">pulls</text>

  <rect class="node" x="930" y="220" width="160" height="64" rx="8"/>
  <text class="t" x="946" y="247">Managed identity</text>
  <text class="s" x="946" y="266">campusflow-github-oidc</text>

  <rect class="node" x="210" y="330" width="170" height="64" rx="8"/>
  <text class="t" x="226" y="357">MySQL Flexible Server</text>
  <text class="s" x="226" y="376">campusflow-db</text>
  <path class="e" d="M500 284 V310 H295 V330" marker-end="url(#a2)"/>
  <text class="l" x="410" y="302" text-anchor="end">SQL over TLS</text>
  <path class="e" d="M440 362 H380" marker-end="url(#a2)"/>
  <text class="l" x="400" y="353" text-anchor="middle">seeds</text>

  <rect class="node" x="210" y="430" width="170" height="56" rx="8"/>
  <text class="t" x="226" y="454">Log Analytics</text>
  <text class="s" x="226" y="472">campusflow-logs</text>
  <path class="e" d="M420 458 H380" marker-end="url(#a2)"/>
  <text class="l" x="400" y="449" text-anchor="middle">logs</text>
</svg>
